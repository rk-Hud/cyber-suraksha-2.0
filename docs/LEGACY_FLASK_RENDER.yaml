services:
  - type: web
    name: cyber-suraksha-2-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PUBLIC_DEMO_MODE
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: CYBER_SURAKSHA_SECRET
        generateValue: true
