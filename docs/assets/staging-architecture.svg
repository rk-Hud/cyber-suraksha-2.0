<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="t d"><title id="t">Staging architecture</title><desc id="d">GitHub Pages routes citizen and owner requests through Cloudflare to two isolated Neon Functions connected to staging PostgreSQL.</desc><rect width="1100" height="380" rx="20" fill="#102b36"/><g font-family="Arial,sans-serif" fill="#fff"><text x="45" y="50" font-size="25" font-weight="bold">CYBER SURAKSHA 2.0 | Staging architecture</text><text x="45" y="77" font-size="14" fill="#b7d6dc">Independent platform · Fictional records only</text><g fill="#164654" stroke="#63b7b2" stroke-width="2"><rect x="45" y="135" width="220" height="95" rx="12"/><rect x="320" y="135" width="210" height="95" rx="12"/><rect x="590" y="105" width="220" height="85" rx="12"/><rect x="590" y="238" width="220" height="85" rx="12"/><rect x="865" y="135" width="190" height="95" rx="12"/></g><g stroke="#72d6c7" stroke-width="3" fill="none"><path d="M265 182H320M530 182H560V147H590M560 182V280H590M810 147H840V182H865M810 280H840V182"/></g><g font-size="18" font-weight="bold" text-anchor="middle"><text x="155" y="169">GitHub Pages</text><text x="425" y="169">Cloudflare Worker</text><text x="700" y="137">Citizen API</text><text x="700" y="270">Owner API</text><text x="960" y="169">PostgreSQL</text></g><g text-anchor="middle" font-size="13" fill="#d3e9ec"><text x="155" y="194">EN · HI · TE</text><text x="155" y="211">Separate sign-in</text><text x="425" y="194">Route allowlist</text><text x="425" y="211">Rate limits + private key</text><text x="700" y="161">Google identity + session</text><text x="700" y="294">Google + password + TOTP</text><text x="960" y="194">Isolated staging</text><text x="960" y="211">Cases + audit records</text></g><text x="45" y="352" font-size="13" fill="#b7d6dc">Server-side authorization remains mandatory. Native Function URLs reject requests without the private gateway credential.</text></g></svg>