<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title"><title id="title">Staging platform architecture</title><rect width="1100" height="620" rx="20" fill="#0a1927"/><g font-family="Arial,sans-serif" fill="#eefaff"><text x="50" y="55" font-size="32" font-weight="700">Staging platform architecture</text><text x="50" y="85" font-size="17" fill="#9bbdc9">CYBER SURAKSHA 2.0 · independent project · fictional records only</text><rect x="300" y="110" width="500" height="65" rx="13" fill="#153546" stroke="#55d8b8" stroke-width="2"/><text x="550" y="139" text-anchor="middle" font-size="23" font-weight="700">GitHub Pages</text><text x="550" y="161" text-anchor="middle" font-size="16" fill="#b9d7df">Citizen and administrator browser interfaces</text><rect x="250" y="215" width="600" height="80" rx="13" fill="#153546" stroke="#55d8b8" stroke-width="2"/><text x="550" y="244" text-anchor="middle" font-size="23" font-weight="700">Cloudflare Worker</text><text x="550" y="266" text-anchor="middle" font-size="16" fill="#b9d7df">Route allowlist · rate limiting · server-only credential</text><rect x="65" y="345" width="450" height="85" rx="13" fill="#153546" stroke="#55d8b8" stroke-width="2"/><text x="290" y="374" text-anchor="middle" font-size="23" font-weight="700">Neon citizen Function</text><text x="290" y="396" text-anchor="middle" font-size="16" fill="#b9d7df">Google sign-in · private case ownership</text><rect x="585" y="345" width="450" height="85" rx="13" fill="#153546" stroke="#55d8b8" stroke-width="2"/><text x="810" y="374" text-anchor="middle" font-size="23" font-weight="700">Neon administrator Function</text><text x="810" y="396" text-anchor="middle" font-size="16" fill="#b9d7df">Google + password + TOTP · fresh MFA</text><rect x="300" y="480" width="500" height="75" rx="13" fill="#153546" stroke="#55d8b8" stroke-width="2"/><text x="550" y="509" text-anchor="middle" font-size="23" font-weight="700">Neon PostgreSQL</text><text x="550" y="531" text-anchor="middle" font-size="16" fill="#b9d7df">Isolated staging data · cases · events · audit</text><g stroke="#67dfc2" fill="none" stroke-width="3"><path d="M550 175V215M550 295V320H290V345M550 320H810V345M290 430V455H550V480M810 430V455H550"/></g><text x="550" y="590" text-anchor="middle" font-size="15" fill="#a9c9d3">Native application routes require the gateway credential; health routes are exempt.</text></g></svg>