<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t"><title id="t">Staging administrator authentication</title><rect width="1100" height="300" rx="20" fill="#091926"/><g font-family="Arial,sans-serif" fill="#eefaff"><text x="50" y="55" font-size="30" font-weight="700">Administrator access control</text><text x="50" y="87" font-size="17" fill="#b4cbd5">Separate owner identity · server-enforced authorization</text><rect x="40" y="128" width="180" height="85" rx="12" fill="#153a46" stroke="#64d6aa" stroke-width="2"/><text x="130" y="175" text-anchor="middle" font-size="16" font-weight="700">Google identity</text><path d="M220 170h30l-8-8m8 8-8 8" fill="none" stroke="#89c7db" stroke-width="2"/><rect x="250" y="128" width="180" height="85" rx="12" fill="#153a46" stroke="#64d6aa" stroke-width="2"/><text x="340" y="175" text-anchor="middle" font-size="16" font-weight="700">Owner password</text><path d="M430 170h30l-8-8m8 8-8 8" fill="none" stroke="#89c7db" stroke-width="2"/><rect x="460" y="128" width="180" height="85" rx="12" fill="#153a46" stroke="#64d6aa" stroke-width="2"/><text x="550" y="175" text-anchor="middle" font-size="16" font-weight="700">Authenticator TOTP</text><path d="M640 170h30l-8-8m8 8-8 8" fill="none" stroke="#89c7db" stroke-width="2"/><rect x="670" y="128" width="180" height="85" rx="12" fill="#153a46" stroke="#64d6aa" stroke-width="2"/><text x="760" y="175" text-anchor="middle" font-size="16" font-weight="700">Fresh MFA session</text><path d="M850 170h30l-8-8m8 8-8 8" fill="none" stroke="#89c7db" stroke-width="2"/><rect x="880" y="128" width="180" height="85" rx="12" fill="#153a46" stroke="#64d6aa" stroke-width="2"/><text x="970" y="175" text-anchor="middle" font-size="16" font-weight="700">Protected workspace</text><text x="50" y="261" font-size="16" fill="#b4cbd5">Citizen tokens do not grant owner privileges. Owner reads and updates require recent MFA.</text></g></svg>