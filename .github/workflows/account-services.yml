name: Account service and Pages checks

on:
  push:
    paths: ['services/account-api/**', 'web/pages/**', '.github/workflows/account-services.yml']
  pull_request:
    paths: ['services/account-api/**', 'web/pages/**', '.github/workflows/account-services.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cs_portal_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            services/account-api/package-lock.json
            web/pages/package-lock.json
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Install build and compatibility dependencies
        run: python -m pip install -r web/pages/requirements-build.txt 'cryptography==50.0.2' 'Werkzeug==3.1.9'
      - name: Verify account API with disposable PostgreSQL
        working-directory: services/account-api
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/cs_portal_test
          REQUIRE_DB_TESTS: '1'
          PYTHON_COMPAT_BIN: ${{ steps.python.outputs.python-path }}
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          node --check src/staging-operator.js
          node --check src/index-staging-operator.js
          node --check scripts/build-staging-operator.mjs
          node scripts/build-staging-operator.mjs
          test -s dist-operator/index.mjs
      - name: Verify multilingual Pages and browser tools
        working-directory: web/pages
        run: |
          npm ci
          npm test
          npm run build
          npm run verify
          node --check source/static/js/operator.js
          python scripts/export_site.py --config config/google-test.json --output /tmp/cs-operator-pages-ci
          test -s /tmp/cs-operator-pages-ci/en/operator.html
          test -s /tmp/cs-operator-pages-ci/static/js/operator.js
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package the reviewed staging website (not deployed)
        run: |
          test -s /tmp/cs-operator-pages-ci/en/account.html
          test -s /tmp/cs-operator-pages-ci/en/operator.html
          test -s /tmp/cs-operator-pages-ci/hi/account.html
          test -s /tmp/cs-operator-pages-ci/te/account.html
          cat > /tmp/cs-operator-pages-ci/REVIEW_ONLY.txt <<'EOF'
          CYBER SURAKSHA 2.0 — SOURCE-ONLY WEBSITE HANDOFF
          This artifact is the independently operated staging citizen and administrator website.
          It is NOT an official government/police reporting portal.
          It is NOT deployed and must accept fictional data only.
          Never publish until the locally restored backup and authorized Google/TOTP sign-ins
          are verified, independent privacy/security review completed and release approved.
          EOF
          printf 'Source commit: %s\n' "$GITHUB_SHA" >> /tmp/cs-operator-pages-ci/REVIEW_ONLY.txt
          ( cd /tmp/cs-operator-pages-ci &&
            find . -type f ! -name 'SHA256SUMS.txt' -print0 |
            sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
      - name: Upload reviewed website files for manual handoff (no publish)
        uses: actions/upload-artifact@v4
        with:
          name: cyber-suraksha-staging-website-review-build
          path: /tmp/cs-operator-pages-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Capture real staging source UI in isolated Chromium (no API traffic)
        run: |
          python -m pip install 'playwright>=1.52,<2'
          python -m playwright install --with-deps chromium
          python web/pages/scripts/capture_workspace_previews.py \
            --source /tmp/cs-operator-pages-ci \
            --output /tmp/cs-workspace-source-previews
      - name: Upload offline source screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: cyber-suraksha-staging-source-previews
          path: /tmp/cs-workspace-source-previews/
          if-no-files-found: error
          retention-days: 14
