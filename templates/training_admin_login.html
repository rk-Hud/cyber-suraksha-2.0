{% extends "base.html" %}
{% block title %}Training Admin Login · CYBER SURAKSHA 2.0{% endblock %}
{% block content %}
<section class="form-card" style="max-width:640px;margin:32px auto">
  <p class="eyebrow">STAGE 3 · LOCAL TRAINING ONLY</p>
  <h1>Training administration</h1>
  <p>This practice dashboard is restricted to this computer. It is not for real citizens or real incident data.</p>
  <form method="post" action="{{ url_for('stage3_login') }}" autocomplete="off">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <label>Local training password
      <input type="password" name="password" required autocomplete="current-password" minlength="12" maxlength="256">
    </label>
    <button class="button" type="submit">Sign in to training →</button>
  </form>
</section>
{% endblock %}
